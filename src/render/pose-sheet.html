<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
.l{position:absolute;color:#fff;font:14px monospace;background:#0008;padding:2px 6px}
</style></head><body><script type="module">
import * as THREE from 'three';
import { buildStage } from '/src/render/stage.js';
import { createRobot } from '/src/render/robot.js';
import { playAnim } from '/src/render/anim.js';
import { Tweens } from '/src/render/tween.js';

const q = new URLSearchParams(location.search);
const id = q.get('who') || 'p1';
const view = q.get('view') || '34';
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const { scene } = buildStage(renderer);
const robot = createRobot(id);
scene.add(robot.group);

const POSES = [
  ['idle', 0], ['guard', 220], ['jab_L', 125], ['jab_R', 125], ['hook_L', 200],
  ['hook_R', 200], ['dodge_L', 260], ['dodge_R', 260], ['hit', 75], ['ko', 900],
];
const COLS = 5, ROWS = 2, cw = W / COLS, ch = H / ROWS;
const cam = new THREE.PerspectiveCamera(38, cw / ch, 0.1, 60);
const CAMS = { '34': [4.6, 2.3, 6.4], side: [7.2, 2.0, 0.2], front: [0, 2.2, 7.5] };
const SC = robot.group.scale.x;

renderer.setScissorTest(true);
renderer.setClearColor(0x04060c);
POSES.forEach(([name, ms], i) => {
  const tw = new Tweens();
  robot.reset();
  tw.cancelTargets(robot.targets);
  let T = 0;
  const step = (n) => { for (let t = 0; t < n; t += 16) { tw.update(16); robot.update(16, T += 16); } };
  step(300);
  if (name !== 'idle') playAnim(robot, name, tw);
  step(ms);
  const x = (i % COLS) * cw, y = H - (Math.floor(i / COLS) + 1) * ch;
  renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
  const c = CAMS[view];
  cam.position.set(c[0]*SC, c[1]*SC, c[2]*SC); cam.lookAt(0, (name === 'ko' ? 0.5 : 1.3)*SC, 0);
  renderer.render(scene, cam);
  const d = document.createElement('div'); d.className = 'l'; d.textContent = id + ' ' + name;
  d.style.left = x + 6 + 'px'; d.style.top = (Math.floor(i / COLS) * ch + 6) + 'px';
  document.body.appendChild(d);
});
</script></body></html>
