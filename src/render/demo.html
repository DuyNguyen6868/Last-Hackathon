<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Render demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud { position: fixed; left: 12px; top: 12px; color: #bfefff; font-size: 13px; line-height: 1.55;
           background: rgba(4, 6, 12, 0.6); border: 1px solid #0d3a4a; padding: 8px 12px; border-radius: 6px; }
    #hud b { color: #fff; }
    #hp { margin-top: 6px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="hud">
    <b>Demo render (không cần game thật)</b><br />
    <b>J/K</b> jab trái/phải · <b>U/I</b> hook trái/phải · giữ <b>L</b> đỡ · <b>Q/E</b> né<br />
    <b>1</b> p2 trúng đòn · <b>2</b> p1 trúng đòn · <b>3</b> p2 đỡ đòn · <b>T</b> bật/tắt AI p2<br />
    <b>O</b> KO p2 · <b>P</b> KO p1 · <b>R</b> hiệp mới (reset)<br />
    <span style="opacity:.7">Bấm phím/click một lần để bật âm thanh</span>
    <div id="hp"></div>
  </div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
